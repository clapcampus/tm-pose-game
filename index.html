<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Fruit Catcher - Pose Game</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>🍎 Fruit Catcher 💣</h1>
      <p>몸을 움직여 과일을 받으세요! 폭탄은 피하세요!</p>
    </header>

    <div class="main-container">
      <!-- 왼쪽: 컨트롤 (웹캠) -->
      <div class="control-section card">
        <h2>📷 Control View</h2>
        <div class="webcam-wrapper">
          <canvas id="webcam-canvas"></canvas>
          <div id="pose-prediction">준비 중...</div>
        </div>
        <div id="label-container"></div>
        <div class="guide-text">
          <p>👈 왼쪽: 바구니 좌이동</p>
          <p>👉 오른쪽: 바구니 우이동</p>
          <p>😐 정면: 정지</p>
        </div>
      </div>

      <!-- 오른쪽: 게임 화면 -->
      <div class="game-section card">
        <div class="game-header">
          <div class="score-box">🏆 <span id="score">0</span></div>
          <div class="timer-box">⏳ <span id="timer">60</span>s</div>
          <div class="life-box" id="life">❤️❤️❤️</div>
        </div>
        
        <div class="game-canvas-wrapper">
          <canvas id="game-canvas" width="400" height="600"></canvas>
          
          <!-- 게임 오버레이 (시작/종료 화면) -->
          <div id="game-overlay" class="overlay">
            <h2 id="overlay-title">Ready?</h2>
            <p id="overlay-msg">카메라 앞에서 준비하세요</p>
            <button id="start-btn" onclick="init()">GAME START</button>
            <button id="restart-btn" onclick="restartGame()" style="display: none;">RESTART</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>

    <!-- App Scripts -->
    <script src="./js/stabilizer.js"></script>
    <script src="./js/poseEngine.js"></script>
    <script src="./js/gameEngine.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
